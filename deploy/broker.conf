# Broker 配置（执行方案 §4.1）
# 关键取舍都写在这里，因为它们会直接改变 E5 实验的结论，不能留给默认值。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 单 Master。同步刷盘的收益抵不过性能损失，崩溃风险由业务侧幂等 + 对账兜底
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 容器内注册的地址必须用服务名，宿主机和 proxy 都能解析
brokerIP1 = broker

# 1GB，顺序写友好
mapedFileSizeCommitLog = 1073741824

# 消息保留 7 天，覆盖「周末出事周一才发现」的最坏情况
fileReservedTime = 168
deleteWhen = 04

# ============================================================
# 磁盘闸门：Broker 会按 store 所在分区的使用率拒写。实测（2026-10-27）这里
# <b>不止一道闸</b>，把 diskMaxUsedSpaceRatio 抬上去之后仍然继续拒写：
#
#   diskMaxUsedSpaceRatio        75   超过它 putMessage 返回 SERVICE_NOT_AVAILABLE
#   diskSpaceCleanForciblyRatio  85   超过它开始强制清理过期文件
#   diskSpaceWarningLevelRatio   90   超过它判定「磁盘告急」，同样拒写
#
# 本机 D 盘常驻 90~91%。第一次只抬 diskMaxUsedSpaceRatio 到 95，消息通了十几分钟又开始
# 全线失败 —— 真正卡住的是 85 / 90 那两道。把三个都推高只是消音：
#   store.log 里会一直刷 "disk space will be full soon, but delete file failed."
# 因为文件还没到 fileReservedTime，没东西可删。
#
# 正确处置是<b>把 store 挪到空盘</b>（docker-compose 里的 RMQ_STORE_DIR，本机指向 C:），
# 阈值保持默认语义。阈值是用来告警的，不是用来消音的。
#
# 拒写的报错长这样，看着像"Broker 挂了"，实际是"活着但拒写"：
#   InternalErrorException: [response-code=50001] service not available now.
#   ... the broker's disk is full [CL: 0.91 CQ: 0.91 INDEX: 0.91]
# 方括号里三个数字就是拒写那一刻算出来的使用率，先看它再去翻配置。
# ============================================================
diskMaxUsedSpaceRatio = 88

# 必须关掉 Topic 自动创建（执行方案 §2.4）：
# 自动创建的 Topic 默认只有 4 个队列，压测时会成为并行度瓶颈，
# 而且极难排查——消费 TPS 上不去、Broker CPU 也不高，看哪里都正常
autoCreateTopicEnable = false

# 消费组允许自动创建：Topic 的队列数必须显式给（上面那条），
# 但消费组自动创建只是省一步，不影响并行度。D1 先降低环境阻断风险，
# 等对账跑起来后再收紧为 false，并把组名纳入 topic-init.sh 校验。
autoCreateSubscriptionGroup = true

# 从节点不参与写，单 Master 场景下无需配置 slave
defaultTopicQueueNums = 4

# 消费端长轮询等待
longPollingEnable = true
waitTimeMillsInSendQueue = 200
